<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Save to a board — Made Good Designs</title>
<style>
  :root{--bg:#fafafa;--surface:#fff;--text:#171717;--muted:#666;--border:#e5e5e5;--strong:#d4d4d4;--accent:#171717;--on:#fff;--ok:#166534}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--surface:#1b1b1b;--text:#f2f2f2;--muted:#a3a3a3;--border:#2c2c2c;--strong:#3a3a3a;--accent:#f2f2f2;--on:#111;--ok:#86efac}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:440px;margin:0 auto;padding:16px}
  h1{font-size:1.1rem;margin:0 0 12px}
  .prev{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:12px}
  .prev img{display:block;width:100%;max-height:260px;object-fit:contain;background:#ddd}
  .prev p{margin:0;padding:8px 10px;font-size:.8rem;color:var(--muted);word-break:break-all}
  label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
  input,select,textarea{width:100%;font:inherit;padding:.5rem .7rem;border:1px solid var(--strong);border-radius:8px;background:var(--surface);color:inherit}
  textarea{min-height:70px;resize:vertical}
  button,.btn{display:inline-block;font:inherit;font-weight:600;border:0;border-radius:999px;padding:.6rem 1.1rem;background:var(--accent);color:var(--on);cursor:pointer;text-decoration:none;margin-top:14px}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:12px;font-size:.9rem;min-height:1.3em}.msg.ok{color:var(--ok);font-weight:600}
  .muted{color:var(--muted);font-size:.85rem}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Save to Made Good Designs</h1>
  <div class="prev" id="prev"><img id="pimg" alt=""><p id="purl"></p></div>
  <div id="signin" hidden>
    <p>Sign in to save this to one of your boards. It’s free.</p>
    <a class="btn" id="signin-link" href="#">Sign in with Google</a>
  </div>
  <form id="form" hidden>
    <label for="title">Title</label><input id="title" maxlength="120">
    <label for="board">Board</label><select id="board"></select>
    <div id="newwrap" hidden><label for="newname">New board name</label><input id="newname" maxlength="80" placeholder="e.g. Client X references">
      <label for="newgroup">Group (optional)</label><input id="newgroup" maxlength="30" list="groups" placeholder="Work, Interests, Personal…"><datalist id="groups"><option value="Work"><option value="Interests"><option value="Personal"></datalist></div>
    <label for="note">Note (optional)</label><textarea id="note" maxlength="500" placeholder="Why are you saving this?"></textarea>
    <button type="submit" id="go">Save</button>
    <div class="msg" id="msg" aria-live="polite"></div>
  </form>
  <p class="muted" id="closehint" hidden>You can close this window.</p>
</div>
<script>
(function(){
  "use strict";
  var API=(window.MGD_API_BASE||"").replace(/\/$/,"");
  var $=function(id){return document.getElementById(id);};
  var api=function(p,o){o=o||{};o.credentials="include";return fetch(API+p,o).then(function(r){return r.json().then(function(d){return {s:r.status,d:d};});});};
  var q=new URLSearchParams(location.search);
  var url=(q.get("url")||"").slice(0,2000), img=(q.get("img")||"").slice(0,2000), title=(q.get("title")||"").slice(0,120);
  if(!/^https?:\/\//i.test(url)){ document.querySelector(".wrap").innerHTML="<h1>Nothing to save</h1><p>Use the “Save to MGD” bookmarklet on a web page, or paste a link into one of your boards.</p><a class='btn' href='"+API+"/'>Open my boards</a>"; return; }
  if(/^https?:\/\//i.test(img)) $("pimg").src=img; else { $("pimg").hidden=true; img=""; }
  $("purl").textContent=url; $("title").value=title;
  api("/api/me").then(function(r){
    if(!r.d.user){ $("signin").hidden=false; $("signin-link").href=API+"/auth/google/login?return="+encodeURIComponent(location.pathname+location.search); return; }
    return api("/api/boards").then(function(r){
      var sel=$("board"), boards=(r.d.boards||[]).slice().sort(function(a,b){ var x=a.group||"~",y=b.group||"~"; return x<y?-1:x>y?1:0; }), groups={};
      boards.forEach(function(b){ var g=b.group||"No group"; (groups[g]=groups[g]||[]).push(b); });
      var many=Object.keys(groups).length>1;
      Object.keys(groups).forEach(function(g){ var host=sel; if(many){ host=document.createElement("optgroup"); host.label=g; sel.appendChild(host); }
        groups[g].forEach(function(b){ var o=document.createElement("option"); o.value=b.id; o.textContent=b.name; host.appendChild(o); }); });
      var n=document.createElement("option"); n.value="__new"; n.textContent="＋ New board…"; sel.appendChild(n);
      var last=""; try{ last=localStorage.getItem("mgd_save_board")||""; }catch(_){}
      if(last && boards.some(function(b){return b.id===last;})) sel.value=last; else if(!boards.length) sel.value="__new";
      $("newwrap").hidden=sel.value!=="__new";
      sel.addEventListener("change",function(){ $("newwrap").hidden=sel.value!=="__new"; });
      $("form").hidden=false;
    });
  });
  $("form").addEventListener("submit",function(e){
    e.preventDefault(); var btn=$("go"), msg=$("msg"); btn.disabled=true; msg.className="msg"; msg.textContent="Saving…";
    var J=function(p,m,b){ return api(p,{method:m,headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); };
    var boardP = $("board").value==="__new"
      ? J("/api/boards","POST",{name:$("newname").value.trim()||"Saved from the web", group:$("newgroup").value.trim()}).then(function(r){ if(!r.d.board) throw new Error(r.d.message||"Couldn’t create the board"); return r.d.board; })
      : Promise.resolve({ id:$("board").value, name:$("board").selectedOptions[0].textContent });
    boardP.then(function(b){
      return J("/api/boards/"+b.id+"/add-url","POST",{url:url, image:img, title:$("title").value.trim()}).then(function(r){
        if(!r.d.ok) throw new Error(r.d.message||"Couldn’t save that page");
        var note=$("note").value.trim();
        var done=function(){ try{ localStorage.setItem("mgd_save_board", b.id); }catch(_){}
          msg.className="msg ok"; msg.textContent="Saved to "+b.name+" ✓"; $("closehint").hidden=false;
          if(window.opener) setTimeout(function(){ window.close(); }, 1600); };
        if(note && r.d.item) return J("/api/boards/"+b.id+"/saves/"+encodeURIComponent(r.d.item.id),"PATCH",{note:note}).then(done);
        done();
      });
    }).catch(function(err){ btn.disabled=false; msg.className="msg"; msg.textContent=err.message||"Something went wrong"; });
  });
})();
</script>
</body>
</html>
